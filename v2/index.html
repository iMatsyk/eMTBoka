<!doctype html>
<html lang="cnr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eMTBoka — e-bike & SUP rental · Tivat</title>
<meta name="description" content="E-bike and SUP rental on the Donja Lastva waterfront in Tivat, Montenegro. Trek e-MTB, i:SY city e-bikes, JOBE SUP boards. Open daily 08:00–20:00.">
<meta name="theme-color" content="#121211">
<meta property="og:title" content="eMTBoka — e-bike & SUP rental · Tivat">
<meta property="og:image" content="img/hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root{
  --ink:#121211; --slate:#1b1b19; --slate-2:#24241f; --line:rgba(255,255,255,.14); --line-2:rgba(255,255,255,.28);
  --text:#f2eee7; --muted:#a8a297; --red:#c82c28; --red-2:#e0443f;
  --paper:#f6f2ea; --paper-ink:#1d1b18; --paper-muted:#6f685d; --paper-line:#e2dccf;
  --serif:'Playfair Display',Georgia,serif; --sans:'Jost',Arial,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
  --head:72px; --track:130px; --pad:clamp(20px,5vw,72px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--ink);color:var(--text);font:300 17px/1.6 var(--sans);-webkit-text-size-adjust:100%}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--red-2);outline-offset:3px;border-radius:6px}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.label{font:500 12px/1.2 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--red-2)}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.08}
h2{font-size:clamp(26px,min(3.6vw,6.4vh),52px);margin-top:12px}
.lead{color:var(--muted);font-size:clamp(15px,min(1.4vw,2.4vh),18px);max-width:54ch}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;font:500 13px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;transition:transform .35s var(--ease),background .35s,border-color .35s,color .35s;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red-2);transform:translateY(-2px)}
.btn-ghost{border:1px solid var(--line-2);color:var(--text);background:rgba(18,18,17,.35)}
.btn-ghost:hover{border-color:var(--text);transform:translateY(-2px)}
.ic svg,.btn svg,.soc svg,.info svg,.opt svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* header */
.top{height:var(--head);flex:0 0 var(--head);display:flex;align-items:center;gap:22px;padding:0 clamp(16px,3vw,40px);background:rgba(18,18,17,.96);border-bottom:1px solid var(--line);position:relative;z-index:20}
.brand img{height:36px;width:auto}
.nav{display:flex;gap:22px;margin-left:auto}
.nav button{font:400 13px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;position:relative;padding:10px 0;color:var(--text)}
.nav button::after{content:"";position:absolute;left:50%;right:50%;bottom:2px;height:1px;background:var(--red-2);transition:.35s var(--ease)}
.nav button:hover::after,.nav button[aria-current="true"]::after{left:0;right:0}
.langs{display:flex;border:1px solid var(--line-2);border-radius:999px;padding:3px}
.langs button{font:500 12px/1 var(--sans);letter-spacing:.12em;padding:9px 11px;border-radius:999px;color:var(--muted);transition:.3s;min-width:40px;min-height:34px}
.langs button[aria-pressed="true"]{background:var(--text);color:var(--ink)}
.msg{display:flex;gap:8px}
.ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--text);transition:.3s var(--ease)}
.ic svg{width:19px;height:19px}
.ic.wa:hover{background:#1F9D55;border-color:#1F9D55}.ic.vb:hover{background:#6F4BC4;border-color:#6F4BC4}.ic.tg:hover{background:#2A8BC9;border-color:#2A8BC9}
.top .right{display:flex;align-items:center;gap:14px}
@media (max-width:1100px){.nav{display:none}.top .right{margin-left:auto}}

/* horizontal panels */
#hscroll{flex:1 1 auto;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
#hscroll::-webkit-scrollbar{display:none}
.panel{flex:0 0 100%;min-width:0;scroll-snap-align:start;position:relative;overflow:hidden;padding:clamp(18px,4.2vh,48px) var(--pad);display:flex;flex-direction:column;justify-content:safe center;gap:clamp(12px,2.6vh,28px);background:var(--ink)}
.panel.alt{background:var(--slate)}
.panel::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 55% at 85% 10%,rgba(200,44,40,.07),transparent 70%)}
.panel>*{position:relative;flex-shrink:0}

/* hero */
.hero{padding-bottom:calc(64px + 2vh);text-align:center;align-items:center}
.hero .bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.hero .bg img{width:100%;height:100%;object-fit:cover;object-position:50% 55%;transform:scale(1.06);animation:heroZoom 14s var(--ease) forwards}
@keyframes heroZoom{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse 62% 55% at 50% 45%,rgba(8,8,8,.66),rgba(8,8,8,.3) 78%),linear-gradient(180deg,rgba(10,10,10,.35),transparent 35%,rgba(18,18,17,.55))}
.hero-in{z-index:1;display:flex;flex-direction:column;align-items:center}
.hero .logo{width:clamp(220px,min(40vw,52vh),520px);height:auto;margin:clamp(10px,2vh,20px) 0;filter:drop-shadow(0 6px 30px rgba(0,0,0,.55))}
.hero h1{font-style:italic;font-weight:500;font-size:clamp(24px,min(3.2vw,5.4vh),42px);text-shadow:0 2px 24px rgba(0,0,0,.5)}
.hero .sub{color:#e6e0d6;margin-top:10px;max-width:60ch;font-size:clamp(15px,min(1.4vw,2.4vh),18px);text-shadow:0 1px 14px rgba(0,0,0,.6)}
.hero .ctas{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:clamp(14px,3vh,30px)}
.rise{opacity:0;transform:translateY(20px);animation:rise 1s var(--ease) forwards}
.rise.d1{animation-delay:.15s}.rise.d2{animation-delay:.3s}.rise.d3{animation-delay:.45s}
@keyframes rise{to{opacity:1;transform:none}}
.facts{position:absolute;left:0;right:0;bottom:0;z-index:1;background:linear-gradient(180deg,transparent,rgba(12,12,11,.38));}
.facts ul{list-style:none;display:grid;grid-template-columns:repeat(3,1fr)}
.facts li{padding:14px 18px;display:flex;gap:10px;align-items:center;justify-content:center;font-size:14px;color:#efe9df;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.facts svg{width:19px;height:19px;color:var(--red-2);flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* booking button that opens into three */
.bx{position:relative;width:250px;height:48px;z-index:5}
.bx .opt,.bx .bx-btn{position:absolute;left:0;top:0;width:100%;height:48px;margin:0}
.opt{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;color:#fff;text-decoration:none;font:500 13px var(--sans);letter-spacing:.14em;text-transform:uppercase;opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,.9,.3,1.3),opacity .2s}
.opt svg{width:20px;height:20px}
.wa{background:#1F9D55}.vb{background:#6F4BC4}.tg{background:#2A8BC9}
.ic.wa,.ic.vb,.ic.tg{background:transparent}
.bx-btn{transition:opacity .2s,transform .3s}
.bx.on .bx-btn{opacity:0;transform:scale(.92);pointer-events:none}
.bx.on .opt{opacity:1;pointer-events:auto}
.bx.on .opt:nth-child(2){transform:translateY(56px)}
.bx.on .opt:nth-child(3){transform:translateY(112px)}
.bx.up.on .opt:nth-child(1){transform:translateY(-112px)}
.bx.up.on .opt:nth-child(2){transform:translateY(-56px)}
.bx.up.on .opt:nth-child(3){transform:none}
.bx::before{content:"";position:absolute;left:-10px;right:-10px;top:-10px;height:68px;border-radius:34px;background:rgba(18,18,17,.92);box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s,height .45s cubic-bezier(.2,.9,.3,1.3),top .45s cubic-bezier(.2,.9,.3,1.3)}
.bx.on::before{opacity:1;height:180px}
.bx.up.on::before{top:-122px}

/* about */
.two{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,6vw,90px);align-items:center;min-height:0}
.story{color:#d8d1c5;font-size:clamp(15px,min(1.35vw,2.3vh),18px)}
.story p+p{margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:clamp(18px,4vw,48px);margin-top:clamp(16px,3.4vh,34px);padding-top:clamp(14px,2.6vh,26px);border-top:1px solid var(--line)}
.stats b{display:block;font:600 clamp(28px,min(3.2vw,6vh),44px)/1 var(--serif)}
.stats span{display:block;margin-top:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.collage{position:relative;height:min(100%,62vh);aspect-ratio:4/4.4;justify-self:center;max-width:100%}
.collage figure{position:absolute;overflow:hidden;border-radius:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.collage img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.collage figure:hover img{transform:scale(1.06)}
.collage .a{inset:0 24% 16% 0}
.collage .b{width:50%;height:56%;right:0;bottom:0;border:6px solid var(--ink)}
.collage .tag{position:absolute;left:-12px;top:24px;background:var(--red);color:#fff;font:500 11px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;padding:12px 16px;border-radius:4px;transform:rotate(-3deg);z-index:2}

/* section head */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}

/* rental cards */
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.6vw,22px);min-height:0}
.rcard{display:flex;flex-direction:column;text-align:left;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,rgba(40,40,36,.85),rgba(22,22,20,.92));transition:transform .5s var(--ease),border-color .4s,box-shadow .5s var(--ease)}
.rcard .ph{height:clamp(110px,26vh,260px);overflow:hidden}
.rcard .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.rcard .bd{padding:clamp(12px,2vh,22px) clamp(14px,1.6vw,22px);display:flex;flex-direction:column;gap:6px}
.rcard h3{font-size:clamp(20px,min(2vw,3.6vh),28px)}
.rcard .kind{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rcard .line{color:#d8d1c5;font-size:15px;line-height:1.45}
.rcard .foot{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}
.rcard .pr{font:600 clamp(22px,min(2.2vw,4vh),32px)/1 var(--serif)}
.rcard .pr small{font:400 13px var(--sans);color:var(--muted);margin-right:6px}
.rcard .more{font:500 12px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--red-2);display:flex;align-items:center;gap:6px}
.rcard .more svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;transition:transform .4s var(--ease)}
.rcard:hover{transform:translateY(-6px);border-color:rgba(224,68,63,.6);box-shadow:0 22px 40px -18px rgba(0,0,0,.8),0 0 34px -8px rgba(200,44,40,.35)}
.rcard:hover .ph img{transform:scale(1.06)}
.rcard:hover .more svg{transform:translateX(4px)}

/* routes */
.routes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:clamp(100px,22vh,230px);gap:clamp(10px,1.4vw,18px)}
.route{position:relative;border-radius:14px;overflow:hidden;text-align:left;isolation:isolate;border:1px solid var(--line)}
.route img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.2s var(--ease)}
.route::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.05) 25%,rgba(0,0,0,.82))}
.route .t{position:absolute;left:16px;right:16px;bottom:14px}
.route .n{font:600 12px var(--sans);letter-spacing:.2em;color:var(--red-2)}
.route h3{font-size:clamp(16px,min(1.5vw,2.8vh),22px);margin-top:4px}
.route .m{font-size:12.5px;color:#cfc8bc;margin-top:4px}
.route:hover img{transform:scale(1.07)}
.route:hover{border-color:rgba(224,68,63,.6)}

/* services */
.svc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.6vw,20px)}
.svc article{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:rgba(36,36,31,.7);display:flex;flex-direction:column}
.svc .ph{height:clamp(80px,22vh,220px);overflow:hidden}
.svc .ph img{width:100%;height:100%;object-fit:cover}
.svc .bd{padding:clamp(10px,1.8vh,18px) 16px}
.svc h3{font-size:clamp(16px,min(1.5vw,2.8vh),21px);display:flex;align-items:center;gap:10px}
.svc h3 svg{width:20px;height:20px;color:var(--red-2);flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.svc p{margin-top:6px;color:var(--muted);font-size:14.5px;line-height:1.45}

/* booking */
.book{background:linear-gradient(135deg,#7d1714,#b0241f 55%,#c82c28)}
.book::before{display:none}
.book .label{color:#ffd2cd}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,3vw,40px)}
.step .n{font:600 clamp(40px,min(5vw,9vh),72px)/1 var(--serif);color:rgba(255,255,255,.35)}
.step h3{font-size:clamp(18px,min(1.8vw,3.2vh),24px);margin-top:6px}
.step p{margin-top:6px;color:#ffe3df;font-size:15.5px}
.bigmsg{display:flex;gap:12px;flex-wrap:wrap}
.bigmsg a{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;background:#121211;color:#fff;text-decoration:none;font:500 13px var(--sans);letter-spacing:.14em;text-transform:uppercase;transition:transform .35s var(--ease),background .3s}
.bigmsg a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bigmsg a:hover{transform:translateY(-2px)}
.bigmsg a.wa:hover{background:#1F9D55}.bigmsg a.vb:hover{background:#6F4BC4}.bigmsg a.tg:hover{background:#2A8BC9}
.hours{display:flex;align-items:center;gap:10px;color:#ffe3df;font-size:15px}
.hours svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,clamp(90px,24vh,250px));gap:clamp(8px,1vw,14px)}
.gal button{border-radius:12px;overflow:hidden;position:relative}
.gal button:first-child{grid-row:span 2}
.gal button:nth-child(n+10){display:none}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.gal button:hover img{transform:scale(1.06)}

/* contact */
.info{list-style:none;display:grid}
.info li{display:grid;grid-template-columns:26px 1fr;gap:14px;padding:clamp(8px,1.5vh,14px) 0;border-bottom:1px solid var(--line)}
.info svg{width:20px;height:20px;color:var(--red-2);margin-top:3px}
.info small{display:block;font:500 11px/1.2 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.info a{text-decoration:none;border-bottom:1px solid var(--line-2)}
.info a:hover{border-color:var(--red-2)}
.mapcard{position:relative;border-radius:18px;overflow:hidden;display:block;text-decoration:none;height:clamp(160px,40vh,400px)}
.mapcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.mapcard:hover img{transform:scale(1.05)}
.mapcard::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.85))}
.mapcard .pin{position:absolute;left:22px;right:22px;bottom:20px;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:16px}
.mapcard .pin b{font:600 22px/1.2 var(--serif);display:block}
.mapcard .pin span{display:block;color:#d8d1c5;font-size:14px;margin-top:2px}
.mapcard .go{width:50px;height:50px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex:none;transition:transform .4s var(--ease)}
.mapcard:hover .go{transform:rotate(-45deg)}
.mapcard .go svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:clamp(10px,2vh,18px);border-top:1px solid var(--line)}
.rating{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14.5px}
.rating .stars{color:#f0c96a;letter-spacing:2px;font-size:16px}
.rating b{color:var(--text);font-weight:500}
.rating a{color:var(--text)}
.soc{display:flex;gap:10px;align-items:center}
.soc a{width:42px;height:42px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;transition:.35s var(--ease)}
.soc a:hover{background:var(--text);color:var(--ink);transform:translateY(-3px)}
.soc svg{width:18px;height:18px}
.copy{color:var(--muted);font-size:13px}

/* overlays */
body.lock .track{pointer-events:none}
.ov{position:fixed;inset:0;z-index:100;display:none}
.ov.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(6,6,6,.75);backdrop-filter:blur(6px);opacity:0;transition:opacity .4s var(--ease)}
.ov.show .scrim{opacity:1}
.sheet{position:absolute;top:4vh;bottom:4vh;left:max(3vw,calc((100vw - 860px)/2));right:max(3vw,calc((100vw - 860px)/2));border-radius:22px;overflow:hidden;background:var(--paper);color:var(--paper-ink);display:flex;flex-direction:column;box-shadow:0 40px 120px rgba(0,0,0,.6);transform:translateY(30px) scale(.97);opacity:0;transition:transform .5s var(--ease),opacity .35s}
.ov.show .sheet{transform:none;opacity:1}
.sheet .x{position:absolute;top:12px;right:12px;z-index:3;width:44px;height:44px;border-radius:50%;background:rgba(18,18,17,.55);color:#fff;display:grid;place-items:center;transition:.3s var(--ease)}
.sheet .x:hover{transform:rotate(90deg);background:#121211}
.sheet .x svg,.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain}
.cover{position:relative;height:clamp(180px,34vh,320px);background:#000;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;transform:scale(1.12);transition:transform 1.6s var(--ease)}
.ov.show .cover img{transform:scale(1)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.75))}
.cover .ttl{position:absolute;left:clamp(20px,4vw,40px);right:70px;bottom:22px;z-index:1;color:#fff}
.cover .ttl small{display:block;font:500 11px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:#ffb3ae;margin-bottom:8px}
.cover .ttl h3{font-size:clamp(28px,4vw,42px)}
.list{padding:clamp(18px,4vw,40px);max-width:760px;margin:0 auto}
.list h4{font:500 12px/1.2 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--red);display:flex;align-items:center;gap:14px;margin:22px 0 6px}
.list h4:first-child{margin-top:0}
.list h4::after{content:"";flex:1;height:1px;background:var(--paper-line)}
.list .lead2{font-size:17px;color:var(--paper-ink)}
.prow{display:flex;justify-content:space-between;gap:20px;padding:13px 6px;border-bottom:1px solid var(--paper-line);font-size:17px}
.prow b{font:600 20px/1.2 var(--serif)}
.list ul{list-style:none}
.list li{position:relative;padding:8px 0 8px 22px;color:var(--paper-ink);font-size:16px}
.list li::before{content:"";position:absolute;left:4px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.note{margin-top:12px;padding:12px 16px;border-radius:10px;background:#ebe5d8;color:var(--paper-muted);font-size:14.5px}
.sheet .bigmsg{margin-top:10px}
.sheet .bigmsg a{background:var(--paper-ink)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid rgba(255,255,255,.4);color:#fff;background:rgba(0,0,0,.3)}

/* stories viewer + lightbox */
.sv,.lb{position:fixed;inset:0;z-index:120;background:rgba(5,5,5,.95);display:none;align-items:center;justify-content:center}
.sv.open,.lb.open{display:flex;animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0}}
.sv-box{position:relative;height:min(92vh,860px);aspect-ratio:9/16;max-width:100vw;border-radius:16px;overflow:hidden;background:#000}
@media (max-width:560px){.sv-box{height:100%;width:100%;border-radius:0;aspect-ratio:auto}}
.sv-box>img{width:100%;height:100%;object-fit:cover;animation:fade .35s}
.sv-bars{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:2}
.sv-bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.sv-bars i b{display:block;height:100%;width:0;background:#fff}
.sv-top{position:absolute;top:24px;left:14px;right:10px;z-index:3;display:flex;align-items:center;gap:10px;color:#fff;font-size:14px}
.sv-top .av{width:32px;height:32px;border-radius:50%;background:#121211;display:grid;place-items:center;overflow:hidden}
.sv-top .av img{width:90%}
.sv-top .icon-btn{margin-left:auto}
.sv-nav{position:absolute;inset:0;display:flex;z-index:1}
.sv-nav button{flex:1}
.lb{padding:60px 70px}
.lb img{max-width:100%;max-height:100%;border-radius:10px;animation:fade .4s}
.lb .icon-btn{position:absolute}
.lb .x{top:14px;right:14px}.lb .pv{left:14px;top:50%;transform:translateY(-50%)}.lb .nx{right:14px;top:50%;transform:translateY(-50%)}
@media (max-width:600px){.lb{padding:60px 8px}.lb .pv,.lb .nx{top:auto;bottom:14px;transform:none}}

/* booking form */
[hidden]{display:none!important}
.bf{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .45s var(--ease),opacity .3s;width:min(560px,94vw);max-height:94vh;overflow-y:auto;background:var(--slate);border:1px solid var(--line-2);border-radius:22px;padding:clamp(20px,3vw,32px);box-shadow:0 40px 120px rgba(0,0,0,.6)}
.ov.show .bf{transform:translate(-50%,-50%);opacity:1}
.bf .x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--text)}
.bf .x svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.bf h3{font-size:clamp(24px,3vw,32px);margin:8px 50px 4px 0}
.bf-route{color:var(--muted);font-size:15px;min-height:4px}
.bf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 14px;margin:16px 0 20px}
.bf .wide{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.f input,.f select{font:400 16px var(--sans);letter-spacing:0;text-transform:none;color:var(--text);background:#121211;border:1px solid var(--line-2);border-radius:12px;min-height:48px;padding:0 14px;width:100%;color-scheme:dark}
.f input:focus,.f select:focus{outline:2px solid var(--red-2);outline-offset:1px}
.f.bad input{border-color:var(--red-2)}
.err{font-style:normal;font-size:12.5px;letter-spacing:0;text-transform:none;color:#ff8a82;min-height:0}
.chk{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:16px;min-height:44px}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk .box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;transition:.2s}
.chk .box::after{content:"";width:11px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.chk input:checked+.box{background:var(--red);border-color:var(--red)}
.chk input:checked+.box::after{opacity:1}
.chk input:focus-visible+.box{outline:2px solid var(--red-2);outline-offset:2px}
.bf .send{width:100%;min-height:54px;color:#fff;gap:10px}
.bf .send svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bf .send.wa{background:#1F9D55}.bf .send.vb{background:#6F4BC4}.bf .send.tg{background:#2A8BC9}
.bf .send:hover{filter:brightness(1.1)}
.bf-note{margin-top:10px;color:var(--muted);font-size:13.5px;text-align:center}
@media (max-width:560px){.bf{top:auto;bottom:0;left:0;width:100%;transform:translateY(30px);border-radius:22px 22px 0 0;max-height:92vh}.ov.show .bf{transform:none}.bf-grid{gap:10px}}

/* road with cyclist (day) */
.track{height:var(--track);flex:0 0 var(--track);position:relative;overflow:hidden;border-top:1px solid var(--line);background:linear-gradient(#3e5f85,#93aecb 42%);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.track.dragging{cursor:grabbing}
.track .sea{position:absolute;left:0;right:0;top:42%;bottom:0;background:linear-gradient(#2d5d8c,#21476c)}
.track svg.layer{position:absolute;left:0;top:0;will-change:transform}
.track .wave{position:absolute;left:0;right:0;height:2px}
.track .moon{position:absolute;right:9%;top:14px;width:22px;height:22px;border-radius:50%;background:#fff3d2;box-shadow:0 0 26px 10px rgba(255,243,210,.45)}
#rider{position:absolute;left:0;top:0;transform-origin:48% 92.5%;z-index:3}
.rail{position:absolute;left:12px;right:12px;top:8px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);z-index:4}
.rail i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--red-2)}
.drag-hint{position:absolute;top:0;z-index:4;display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--text);color:var(--ink);font:500 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;pointer-events:none;transition:opacity .4s;animation:nudge 1.4s ease-in-out infinite}
.drag-hint.gone{opacity:0}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}

/* phone */
@media (max-width:760px){

  body{font-size:15.5px}
  .top{gap:8px;padding:0 12px}
  .brand img{height:26px}
  .top .right{gap:6px}
  .langs{padding:2px}
  .langs button{min-width:32px;padding:7px 6px;font-size:11px;letter-spacing:.06em}
  .msg{gap:4px}
  .ic{width:34px;height:34px}
  .ic svg{width:17px;height:17px}
  .panel{justify-content:flex-start;padding-top:16px;padding-bottom:16px}
  .hero{justify-content:center;padding-bottom:150px}
  .hero .bx{width:220px}
  .facts ul{grid-template-columns:1fr}
  .facts li{padding:6px 16px;justify-content:flex-start;font-size:13px}
  .facts{background:linear-gradient(180deg,transparent,rgba(12,12,11,.45) 40%)}
  .two{grid-template-columns:1fr;gap:16px}
  .collage{height:26vh;aspect-ratio:auto;width:100%}
  .collage .a{inset:0 28% 0 0}.collage .b{width:44%;height:70%}
  .stats{grid-template-columns:repeat(3,1fr)}
  .cards3{grid-template-columns:1fr;gap:10px}
  .rcard{flex-direction:row}
  .rcard .ph{height:auto;width:34%;flex:none;position:relative}
  .rcard .ph img{position:absolute;inset:0}
  .rcard h3{font-size:20px}
  .rcard .line{display:none}
  .rcard .bd{padding:10px 12px;gap:3px}
  .routes{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:clamp(86px,17vh,150px);gap:8px}
  .route .t{left:10px;right:10px;bottom:8px}
  .route .m{display:none}
  .svc{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .svc .ph{height:clamp(60px,11vh,120px)}
  .svc .bd{padding:8px 10px}
  .svc p{font-size:12.5px;line-height:1.35}
  .steps{grid-template-columns:1fr;gap:10px}
  .step{display:flex;gap:14px;align-items:flex-start}
  .step .n{min-width:34px}
  .step h3{margin-top:0}
  .bigmsg a{min-height:46px;padding:0 16px}
  .gal{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,clamp(70px,16vh,170px));gap:6px}
  .gal button:first-child{grid-row:span 2;grid-column:span 2}
  .gal button:nth-child(n+7){display:none}
  .mapcard{height:clamp(110px,22vh,200px)}
  .info li{padding:7px 0}
  .head .lead{display:none}
}

      var rr0 = hsh(x0 * 1.3);
      [x0, x0 + PR].forEach(function (x) {
        var y = roadY(x) - 4 * k;
        if (rr0 > .62) { var th = (30 + 16 * hsh(x0 + 11)) * k, tw = 5 * k; near += 'M' + x + ' ' + f(y - th) + ' Q' + f(x + tw) + ' ' + f(y - th * .35) + ' ' + x + ' ' + f(y) + ' Q' + f(x - tw) + ' ' + f(y - th * .35) + ' ' + x + ' ' + f(y - th) + ' Z'; }
        else if (rr0 < .25) for (var q = 0; q < 5; q++) { var fx = x + q * 5 * k, fy = y - (2 + 4 * hsh(x0 + q)) * k, rr = 1.6 * k; flw += 'M' + f(fx - rr) + ' ' + f(fy) + ' a' + f(rr) + ' ' + f(rr) + ' 0 1 0 ' + f(2 * rr) + ' 0 a' + f(rr) + ' ' + f(rr) + ' 0 1 0 ' + f(-2 * rr) + ' 0'; }
      });
    }
    svgSet($('lRoad'), 2 * PR,
      '<defs><radialGradient id="glow"><stop offset="0" stop-color="#f0c96a" stop-opacity="0"/><stop offset="1" stop-color="#f0c96a" stop-opacity="0"/></radialGradient></defs>' +
      '<path d="' + wall + '" fill="#8a785f"/><path d="' + joints + '" fill="none" stroke="#6f604c" stroke-width="1.2"/>' +
      '<path d="' + rd + '" fill="none" stroke="#45494e" stroke-width="' + Math.max(7, Math.round(H / 16)) + '" stroke-linejoin="round"/>' +
      '<path d="' + rd + '" fill="none" stroke="#cfc8bc" stroke-width="1.4" stroke-dasharray="16 16" opacity=".8"/>' +
      '<path d="' + near + '" fill="#1f3020"/><path d="' + flw + '" fill="#b5506f"/>' +
      '<path d="' + lamps + '" fill="none" stroke="#5a5650" stroke-width="2" stroke-linecap="round"/>' +
      [380, 1020, 1660, 2300, 2780, 3420, 4060, 4700].map(function (lx) { var ly = roadY(lx) - 4 * k - 38 * k; return '<circle cx="' + f(lx + 8.5 * k) + '" cy="' + f(ly + 3 * k) + '" r="' + f(22 * k) + '" fill="url(#glow)"/>'; }).join('') +
      '<path d="' + heads + '" fill="#d9d4cc"/>');

    var rider = $('rider'); rider.setAttribute('width', T.rw); rider.setAttribute('height', T.rh);
    $('w1').style.cssText = 'top:' + Math.round(sea + 9 * k) + 'px;background:repeating-linear-gradient(90deg,rgba(242,238,231,.22) 0 16px,transparent 16px 54px)';
    $('w2').style.cssText = 'top:' + Math.round(sea + 22 * k) + 'px;background:repeating-linear-gradient(90deg,rgba(242,238,231,.14) 0 10px,transparent 10px 70px)';
    update();
  }

  function leg(hip, foot) {
    var L = 26, dx = foot[0] - hip[0], dy = foot[1] - hip[1], dist = Math.hypot(dx, dy) || 1;
    var d = Math.min(dist, 2 * L - 0.01), h = Math.sqrt(L * L - d * d / 4);
    var mx = (hip[0] + foot[0]) / 2, my = (hip[1] + foot[1]) / 2, nx = -dy / dist, ny = dx / dist;
    var s = nx >= 0 ? 1 : -1;
    return hip.join(',') + ' ' + f(mx + s * nx * h) + ',' + f(my + s * ny * h) + ' ' + f(foot[0]) + ',' + f(foot[1]);
  }
  var shift = function (el, left, speed, period) { el.style.transform = 'translate3d(' + (-((left * speed) % period)).toFixed(1) + 'px,0,0)'; };

  function update() {
    var left = scroller.scrollLeft, max = Math.max(1, scroller.scrollWidth - scroller.clientWidth);
    var p = Math.min(1, Math.max(0, left / max)), cw = scroller.clientWidth;
    shift($('lFar'), left, 0.12, PF); shift($('lSea'), left, 0.25, PS); shift($('lForest'), left, 0.5, PFo); shift($('lRoad'), left, 1, PR);
    $('w1').style.backgroundPositionX = (-left * 0.28).toFixed(1) + 'px';
    $('w2').style.backgroundPositionX = (-left * 0.33 + 20).toFixed(1) + 'px';
    var sx = p * Math.max(0, cw - T.rw), wx = left + sx + T.rw * 0.48, y = roadY(wx), s = T.rw / 120;
    var ang = Math.atan2(roadY(wx + 22) - roadY(wx - 22), 44) * 180 / Math.PI;
    $('rider').style.transform = 'translate(' + sx.toFixed(1) + 'px,' + (y - 74 * s - 3 * T.k).toFixed(1) + 'px) rotate(' + ang.toFixed(1) + 'deg)';
    var a = left * 1.1 * Math.PI / 180, wheel = (left * 1.1) % 360;
    $('spk1').setAttribute('transform', 'rotate(' + wheel.toFixed(1) + ' 24 56)');
    $('spk2').setAttribute('transform', 'rotate(' + wheel.toFixed(1) + ' 92 56)');
    $('legF').setAttribute('points', leg([44, 26], [50 + 10 * Math.cos(a), 56 + 10 * Math.sin(a)]));
    $('legB').setAttribute('points', leg([44, 26], [50 - 10 * Math.cos(a), 56 - 10 * Math.sin(a)]));
    $('railFill').style.width = (p * 100).toFixed(1) + '%';
    var hint = $('dragHint');
    hint.style.left = Math.min(sx + T.rw + 4, cw - hint.offsetWidth - 8) + 'px';
    hint.style.top = Math.max(18, y - 74 * s - 3 * T.k + T.rh * 0.25) + 'px';
    markNav();
  }

  /* drag the cyclist (or anywhere on the road) to move through the site; tap = next / previous */
  var track = $('track'), drag = null;
  function hideHint() { $('dragHint').classList.add('gone'); }
  track.addEventListener('pointerdown', function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    stopIntro();
    drag = { id: e.pointerId, x0: e.clientX, left0: scroller.scrollLeft, moved: false };
    try { track.setPointerCapture(e.pointerId); } catch (err) {}
    track.classList.add('dragging');
  });
  track.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x0;
    if (!drag.moved && Math.abs(dx) < 6) return;
    if (!drag.moved) { drag.moved = true; scroller.style.scrollSnapType = 'none'; scroller.style.scrollBehavior = 'auto'; hideHint(); }
    var max = Math.max(1, scroller.scrollWidth - scroller.clientWidth), span = Math.max(1, scroller.clientWidth - T.rw);
    scroller.scrollLeft = Math.max(0, Math.min(max, drag.left0 + dx / span * max));
    e.preventDefault();
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag; drag = null; track.classList.remove('dragging');
    var cw = scroller.clientWidth, n = scroller.children.length;
    if (!d.moved) {
      var r = $('rider').getBoundingClientRect(), cur = Math.round(scroller.scrollLeft / cw);
      goTo(Math.max(0, Math.min(n - 1, cur + (e.clientX >= r.left + r.width * 0.3 ? 1 : -1)))); hideHint(); return;
    }
    var frac = scroller.scrollLeft / cw, dir = scroller.scrollLeft - d.left0;
    var target = Math.max(0, Math.min(n - 1, dir > 0 ? Math.ceil(frac - 0.25) : Math.floor(frac + 0.25)));
    scroller.style.scrollBehavior = ''; goTo(target);
    setTimeout(function () { if (!drag) scroller.style.scrollSnapType = ''; }, 700);
  }
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);

  /* first-open nudge: the page slides a little to the right and back */
  var intro = null;
  function stopIntro() { if (!intro) return; cancelAnimationFrame(intro.raf); intro = null; scroller.style.scrollSnapType = ''; scroller.style.scrollBehavior = ''; }
  function runIntro() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (scroller.scrollLeft > 0 || document.body.classList.contains('lock')) return;
    var dist = scroller.clientWidth * 0.3, dur = 1700, t0 = null;
    scroller.style.scrollSnapType = 'none'; scroller.style.scrollBehavior = 'auto'; intro = {};
    var step = function (ts) {
      if (!intro) return; if (t0 === null) t0 = ts;
      var t = Math.min(1, (ts - t0) / dur);
      scroller.scrollLeft = dist * Math.sin(Math.PI * t);
      if (t < 1) intro.raf = requestAnimationFrame(step); else { scroller.scrollLeft = 0; stopIntro(); }
    };
    intro.raf = requestAnimationFrame(step);
  }

  var ticking = false;
  scroller.addEventListener('scroll', function () {
    if (!intro && scroller.scrollLeft > 20) hideHint();
    if (!intro) closeAll();
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () { ticking = false; update(); });
  }, { passive: true });
  var lastPhone = window.innerWidth <= 760;
  window.addEventListener('resize', function () {
    var phone = window.innerWidth <= 760;
    if (phone !== lastPhone) { lastPhone = phone; build(); } else update();
    fitPanels();
  });

  render();
  build();
  window.addEventListener('load', fitPanels);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPanels);
  setTimeout(runIntro, 1100);
})();
</script>
